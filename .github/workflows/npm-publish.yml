name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'docker-compose.yml'
      - '.github/workflows/npm-publish.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'docker-compose.yml'
      - '.github/workflows/npm-publish.yml'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # Build and Push Docker Images (parallel execution)
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            awsmallick1999/catalog-server:latest
            awsmallick1999/catalog-server:${{ github.sha }}
          cache-from: type=registry,ref=awsmallick1999/catalog-server:buildcache
          cache-to: type=registry,ref=awsmallick1999/catalog-server:buildcache,mode=max
          platforms: linux/amd64

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            awsmallick1999/catalog-client:latest
            awsmallick1999/catalog-client:${{ github.sha }}
          cache-from: type=registry,ref=awsmallick1999/catalog-client:buildcache
          cache-to: type=registry,ref=awsmallick1999/catalog-client:buildcache,mode=max
          platforms: linux/amd64

  # Deploy to AWS EC2 (only on push to main)
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            # Use ec2-user's home directory instead of root
            PROJECT_DIR="/home/ec2-user/Catalog-Collections"
            
            # Install dependencies only if not available
            if ! command -v git &> /dev/null; then
              echo "Git not found. Installing git..."
              sudo yum install -y git || sudo apt-get install -y git
            fi
            
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              sudo yum install -y docker || sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER || true
            fi
            
            # Check if project exists, if not clone it
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found. Creating directory and cloning repository..."
              mkdir -p /home/ec2-user
              cd /home/ec2-user
              git clone https://github.com/Chinmaya1999/Catalog-Collections.git
            fi
            
            # Navigate to project directory
            cd $PROJECT_DIR || exit 1
            
            # Pull latest changes
            git pull origin main
            
            # Create .env file from GitHub secrets
            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" >> .env
            echo "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" >> .env
            
            # Create Docker network for container communication
            sudo docker network create catalog-network || true
            
            # Pull latest images
            sudo docker pull awsmallick1999/catalog-server:latest
            sudo docker pull awsmallick1999/catalog-client:latest
            
            # Stop and remove old containers using docker-compose
            sudo docker-compose down || true
            
            # Start containers using docker-compose
            sudo docker-compose up -d
            
            # Wait for containers to be healthy
            sleep 10
            
            # Check container status
            sudo docker ps
            
            # Clean up unused images
            sudo docker image prune -f

  # Rollback (only on failure)
  rollback:
    needs: [deploy]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            PROJECT_DIR="/home/ec2-user/Catalog-Collections"
            cd $PROJECT_DIR
            sudo docker-compose down
            # Pull previous stable versions if tagged
            sudo docker pull awsmallick1999/catalog-server:previous || echo "No previous version found"
            sudo docker pull awsmallick1999/catalog-client:previous || echo "No previous version found"
            # Update docker-compose.yml to use previous tags
            sudo sed -i 's|awsmallick1999/catalog-server:latest|awsmallick1999/catalog-server:previous|g' docker-compose.yml
            sudo sed -i 's|awsmallick1999/catalog-client:latest|awsmallick1999/catalog-client:previous|g' docker-compose.yml
            sudo docker-compose up -d || echo "Rollback failed, containers may not be running"

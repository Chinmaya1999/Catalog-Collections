name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # Build and Push Docker Images
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            awsmallick1999/catalog-server:latest
            awsmallick1999/catalog-server:${{ github.sha }}
          cache-from: type=registry,ref=awsmallick1999/catalog-server:buildcache
          cache-to: type=registry,ref=awsmallick1999/catalog-server:buildcache,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            awsmallick1999/catalog-client:latest
            awsmallick1999/catalog-client:${{ github.sha }}
          cache-from: type=registry,ref=awsmallick1999/catalog-client:buildcache
          cache-to: type=registry,ref=awsmallick1999/catalog-client:buildcache,mode=max

  # Deploy to AWS EC2
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Configuration
            PROJECT_DIR="/home/ec2-user/Catalog-Collections"
            DOMAIN="catalog.adihuman.com"
            API_DOMAIN="api.adihuman.com"
            
            echo "🚀 Starting deployment..."
            
            # Install dependencies if needed
            if ! command -v git &> /dev/null; then
              echo "📦 Installing git..."
              sudo yum install -y git || sudo apt-get install -y git
            fi
            
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              sudo yum install -y docker || sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user || true
            fi
            
            # Clone or update project
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📥 Cloning repository..."
              mkdir -p /home/ec2-user
              cd /home/ec2-user
              git clone https://github.com/Chinmaya1999/Catalog-Collections.git
            fi
            
            cd $PROJECT_DIR || exit 1
            echo "🔄 Pulling latest changes..."
            git pull origin main
            
            # Stop and remove old containers
            echo "🛑 Stopping old containers..."
            sudo docker stop frontend backend 2>/dev/null || true
            sudo docker rm frontend backend 2>/dev/null || true
            
            # Pull latest images
            echo "📥 Pulling latest Docker images..."
            sudo docker pull awsmallick1999/catalog-server:latest
            sudo docker pull awsmallick1999/catalog-client:latest
            
            # Setup SSL certificates
            if [ ! -d "/etc/letsencrypt/live/$DOMAIN" ]; then
              echo "🔐 Setting up SSL certificates..."
              sudo yum install -y certbot || sudo apt-get install -y certbot
              
              # Stop any services using port 80
              sudo docker stop frontend 2>/dev/null || true
              sudo systemctl stop nginx 2>/dev/null || true
              sudo systemctl stop httpd 2>/dev/null || true
              
              # Wait for port 80 to be free
              sleep 5
              
              # Obtain SSL certificates
              sudo certbot certonly --standalone \
                --email "pradipta@uuoinnovation.com" \
                --agree-tos \
                --no-eff-email \
                -d $DOMAIN \
                -d $API_DOMAIN \
                --non-interactive || echo "⚠️ SSL certificate setup failed"
              
              # Fix SSL permissions
              sudo chmod 755 /etc/letsencrypt/
              sudo chmod 755 /etc/letsencrypt/live/
              sudo chmod 755 /etc/letsencrypt/live/$DOMAIN/
              sudo chmod 644 /etc/letsencrypt/live/$DOMAIN/fullchain.pem
              sudo chmod 644 /etc/letsencrypt/live/$DOMAIN/privkey.pem
              sudo chmod 755 /etc/letsencrypt/archive/
              sudo chmod 755 /etc/letsencrypt/archive/$DOMAIN/
              sudo chmod 644 /etc/letsencrypt/archive/$DOMAIN/fullchain*.pem
              sudo chmod 644 /etc/letsencrypt/archive/$DOMAIN/privkey*.pem
            fi
            
            # Setup SSL auto-renewal
            (crontab -l 2>/dev/null | grep -v "certbot renew" || true; echo "0 0 * * 0 certbot renew --quiet && docker restart frontend") | crontab -
            
            # Create Docker network
            sudo docker network create catalog-network 2>/dev/null || true
            
            # Create .env file with all environment variables
            echo "📝 Creating environment file..."
            cat > .env << 'EOF'
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            PORT=5002
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
            EOF
            
            # Start backend container
            echo "🚀 Starting backend container..."
            sudo docker run -d \
              --name backend \
              --network catalog-network \
              --network-alias server \
              -p 5002:5002 \
              --env-file .env \
              --restart unless-stopped \
              awsmallick1999/catalog-server:latest
            
            # Wait for backend to initialize
            echo "⏳ Waiting for backend to initialize..."
            sleep 10
            
            # Check if backend is healthy
            if sudo docker ps | grep -q backend; then
              echo "✅ Backend container is running"
            else
              echo "❌ Backend container failed to start"
              sudo docker logs backend --tail 50
              exit 1
            fi
            
            # Start frontend container
            echo "🚀 Starting frontend container..."
            sudo docker run -d \
              --name frontend \
              --network catalog-network \
              -p 80:80 \
              -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v /etc/letsencrypt/live/$DOMAIN/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro \
              -v /etc/letsencrypt/live/$DOMAIN/privkey.pem:/etc/nginx/ssl/privkey.pem:ro \
              --user root \
              --restart unless-stopped \
              awsmallick1999/catalog-client:latest
            
            # Check if frontend is healthy
            if sudo docker ps | grep -q frontend; then
              echo "✅ Frontend container is running"
            else
              echo "❌ Frontend container failed to start"
              sudo docker logs frontend --tail 50
              exit 1
            fi
            
            # Clean up unused images
            sudo docker image prune -f
            
            # Show container status
            echo "📊 Container Status:"
            sudo docker ps
            
            # Show backend logs
            echo "📋 Backend Logs (last 20 lines):"
            sudo docker logs backend --tail 20
            
            # Show frontend logs
            echo "📋 Frontend Logs (last 20 lines):"
            sudo docker logs frontend --tail 20
            
            # Test API endpoint
            echo "🧪 Testing API endpoint..."
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:5002/api/catalog | grep -q "200\|500"; then
              echo "✅ API endpoint is responding"
            else
              echo "⚠️ API endpoint might not be accessible"
            fi
            
            echo "✅ Deployment completed successfully!"
            echo "🌐 Website: https://$DOMAIN"
            echo "🔗 API: https://$API_DOMAIN"

  # Rollback on failure
  rollback:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🔄 Starting rollback..."
            
            PROJECT_DIR="/home/ec2-user/Catalog-Collections"
            cd $PROJECT_DIR || exit 1
            
            # Stop current containers
            echo "🛑 Stopping current containers..."
            sudo docker stop frontend backend 2>/dev/null || true
            sudo docker rm frontend backend 2>/dev/null || true
            
            # Get previous commit hash
            PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
            
            # Pull previous versions
            echo "📥 Pulling previous versions..."
            sudo docker pull awsmallick1999/catalog-server:$PREVIOUS_COMMIT || sudo docker pull awsmallick1999/catalog-server:latest
            sudo docker pull awsmallick1999/catalog-client:$PREVIOUS_COMMIT || sudo docker pull awsmallick1999/catalog-client:latest
            
            # Start previous versions
            echo "🔄 Starting previous versions..."
            sudo docker run -d \
              --name backend \
              --network catalog-network \
              --network-alias server \
              -p 5002:5002 \
              --env-file .env \
              --restart unless-stopped \
              awsmallick1999/catalog-server:$PREVIOUS_COMMIT || sudo docker run -d \
              --name backend \
              --network catalog-network \
              --network-alias server \
              -p 5002:5002 \
              --env-file .env \
              --restart unless-stopped \
              awsmallick1999/catalog-server:latest
            
            sudo docker run -d \
              --name frontend \
              --network catalog-network \
              -p 80:80 \
              -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --user root \
              --restart unless-stopped \
              awsmallick1999/catalog-client:$PREVIOUS_COMMIT || sudo docker run -d \
              --name frontend \
              --network catalog-network \
              -p 80:80 \
              -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --user root \
              --restart unless-stopped \
              awsmallick1999/catalog-client:latest
            
            echo "✅ Rollback completed!"
            sudo docker ps
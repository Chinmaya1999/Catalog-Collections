name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # Build and Push Docker Images
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            awsmallick1999/catalog-server:latest
            awsmallick1999/catalog-server:${{ github.sha }}
          cache-from: type=registry,ref=awsmallick1999/catalog-server:buildcache
          cache-to: type=registry,ref=awsmallick1999/catalog-server:buildcache,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            awsmallick1999/catalog-client:latest
            awsmallick1999/catalog-client:${{ github.sha }}
          cache-from: type=registry,ref=awsmallick1999/catalog-client:buildcache
          cache-to: type=registry,ref=awsmallick1999/catalog-client:buildcache,mode=max

  # Deploy to AWS EC2
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Use ec2-user's home directory instead of root
            PROJECT_DIR="/home/ec2-user/Catalog-Collections"
            
            # Install git if not available
            if ! command -v git &> /dev/null; then
              echo "Git not found. Installing git..."
              sudo yum install -y git || sudo apt-get install -y git
            fi
            
            # Install Docker if not available
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              sudo yum install -y docker || sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER || true
            fi
            
            # Check if project exists, if not clone it
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found. Creating directory and cloning repository..."
              mkdir -p /home/ec2-user
              cd /home/ec2-user
              git clone https://github.com/Chinmaya1999/Catalog-Collections.git
            fi
            
            # Navigate to project directory
            cd $PROJECT_DIR || exit 1
            
            # Pull latest changes
            git pull origin main
            
            # Stop and remove old containers
            sudo docker stop frontend backend mongodb || true
            sudo docker rm frontend backend mongodb || true
            
            # Pull latest images
            sudo docker pull awsmallick1999/catalog-server:latest
            sudo docker pull awsmallick1999/catalog-client:latest
            
            # Setup SSL certificates if not already present
            if [ ! -d "/etc/letsencrypt/live/catalog.adihuman.com" ]; then
              echo "Setting up SSL certificates..."
              # Install Certbot if not present
              sudo yum install -y certbot python3-certbot-nginx || sudo apt-get install -y certbot python3-certbot-nginx
              
              # Stop any existing frontend to free port 80
              sudo docker stop frontend || true
              
              # Obtain SSL certificates for both domains
              sudo certbot certonly --standalone \
                --email "pradipta@uuoinnovation.com" \
                --agree-tos \
                --no-eff-email \
                -d catalog.adihuman.com \
                -d api.adihuman.com \
                --non-interactive || echo "SSL certificate setup failed, continuing without SSL"
            fi
            
            # Setup automatic SSL certificate renewal
            (crontab -l 2>/dev/null | grep -v "certbot renew" || true; echo "0 0 * * 0 certbot renew --quiet && docker restart frontend") | crontab -
            
            # Create Docker network for container communication
            sudo docker network create catalog-network || true
            
            # Start MongoDB container (if using local MongoDB)
            echo "Starting MongoDB container..."
            sudo docker run -d \
              --name mongodb \
              --network catalog-network \
              --network-alias mongodb \
              -p 27017:27017 \
              -v mongodb_data:/data/db \
              --restart unless-stopped \
              mongo:latest
            
            # Wait for MongoDB to be ready
            echo "Waiting for MongoDB to start..."
            sleep 15
            
            # Start backend container with ALL environment variables
            echo "Starting backend container..."
            sudo docker run -d \
              --name backend \
              --network catalog-network \
              --network-alias backend \
              -p 5002:5002 \
              -e MONGODB_URI="mongodb+srv://contact_db_user:VM7vPjtxhkZvOlnU@clusteradhiuman.znzeltu.mongodb.net/Adhiuman?appName=ClusterAdhiuman" \
              -e PORT="5002" \
              -e JWT_SECRET="adihuman-secret-key-change-in-production" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}" \
              -e GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}" \
              --restart unless-stopped \
              awsmallick1999/catalog-server:latest
            
            # Wait for backend to initialize
            echo "Waiting for backend to initialize..."
            sleep 10
            
            # Start frontend container
            echo "Starting frontend container..."
            sudo docker run -d \
              --name frontend \
              --network catalog-network \
              -p 80:80 \
              -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --restart unless-stopped \
              awsmallick1999/catalog-client:latest
            
            # Wait for containers to start
            sleep 5
            
            # Check container status
            echo "=== Container Status ==="
            sudo docker ps
            
            # Check backend logs
            echo "=== Backend Logs ==="
            sudo docker logs backend --tail 20
            
            # Check if backend is responding
            echo "=== Testing Backend API ==="
            sudo docker exec backend curl -s http://localhost:5002/api/catalog || echo "Backend API not responding yet"
            
            # Clean up unused images
            sudo docker image prune -f

  # Rollback
  rollback:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            PROJECT_DIR="/home/ec2-user/Catalog-Collections"
            cd $PROJECT_DIR
            
            echo "=== Starting Rollback ==="
            sudo docker stop frontend backend mongodb || true
            sudo docker rm frontend backend mongodb || true
            
            # Pull previous stable versions if tagged
            sudo docker pull awsmallick1999/catalog-server:previous || echo "No previous version found"
            sudo docker pull awsmallick1999/catalog-client:previous || echo "No previous version found"
            
            # Start MongoDB
            sudo docker run -d \
              --name mongodb \
              --network catalog-network \
              --network-alias mongodb \
              -p 27017:27017 \
              -v mongodb_data:/data/db \
              --restart unless-stopped \
              mongo:latest || echo "MongoDB start failed"
            
            sleep 10
            
            # Rollback backend
            sudo docker run -d \
              --name backend \
              --network catalog-network \
              --network-alias backend \
              -p 5002:5002 \
              -e MONGODB_URI="mongodb+srv://contact_db_user:VM7vPjtxhkZvOlnU@clusteradhiuman.znzeltu.mongodb.net/Adhiuman?appName=ClusterAdhiuman" \
              -e PORT="5002" \
              -e JWT_SECRET="adihuman-secret-key-change-in-production" \
              --restart unless-stopped \
              awsmallick1999/catalog-server:previous || echo "Backend rollback failed"
            
            sleep 5
            
            # Rollback frontend
            sudo docker run -d \
              --name frontend \
              --network catalog-network \
              -p 80:80 \
              -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --restart unless-stopped \
              awsmallick1999/catalog-client:previous || echo "Frontend rollback failed"
            
            echo "=== Rollback Status ==="
            sudo docker ps
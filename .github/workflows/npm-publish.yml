name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # Build and Push Docker Images
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List directory structure (for debugging)
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Checking for server directory:"
          ls -la server || echo "server directory not found"
          echo "Checking for client directory:"
          ls -la client || echo "client directory not found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/catalog-server:latest
            ${{ secrets.DOCKER_USERNAME }}/catalog-server:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catalog-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catalog-server:buildcache,mode=max
          platforms: linux/amd64

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List directory structure (for debugging)
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Checking for client directory:"
          ls -la client || echo "client directory not found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/catalog-client:latest
            ${{ secrets.DOCKER_USERNAME }}/catalog-client:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catalog-client:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catalog-client:buildcache,mode=max
          platforms: linux/amd64

  # Deploy to AWS EC2
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Use ec2-user's home directory instead of root
            PROJECT_DIR="/home/ec2-user/Catalog-Collections"
            
            # Check if project exists, if not clone it
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found. Cloning repository..."
              cd /home/ec2-user
              git clone https://github.com/Chinmaya1999/Catalog-Collections.git
            fi
            
            # Navigate to project directory
            cd $PROJECT_DIR || exit 1
            
            # Pull latest changes
            git pull origin main
            
            # Stop and remove old containers
            sudo docker stop backend frontend || true
            sudo docker rm backend frontend || true
            
            # Pull latest images
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/catalog-server:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/catalog-client:latest
            
            # Create .env file from GitHub secret
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Start backend container with OAuth environment variables
            sudo docker run -d \
              --name backend \
              -p 5002:5002 \
              --env-file .env \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}" \
              -e GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}" \
              ${{ secrets.DOCKER_USERNAME }}/catalog-server:latest

            # Start frontend container
            sudo docker run -d \
              --name frontend \
              -p 3000:80 \
              ${{ secrets.DOCKER_USERNAME }}/catalog-client:latest
            
            # Clean up unused images
            sudo docker image prune -f
            
            # Check container status
            sudo docker ps

  # Rollback
  rollback:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            PROJECT_DIR="/home/ec2-user/Catalog-Collections"
            cd $PROJECT_DIR || exit 1
            
            echo "Attempting rollback..."
            
            # Stop current containers
            sudo docker stop backend frontend || true
            sudo docker rm backend frontend || true
            
            # Try to pull previous version
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/catalog-server:previous || echo "No previous version found"
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/catalog-client:previous || echo "No previous version found"
            
            # Start containers with previous version (or fallback to current if previous not available)
            sudo docker run -d \
              --name backend \
              -p 5002:5002 \
              --env-file .env \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}" \
              -e GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}" \
              ${{ secrets.DOCKER_USERNAME }}/catalog-server:previous || \
              sudo docker run -d \
                --name backend \
                -p 5002:5002 \
                --env-file .env \
                -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
                -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
                -e GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}" \
                -e GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}" \
                ${{ secrets.DOCKER_USERNAME }}/catalog-server:latest

            sudo docker run -d \
              --name frontend \
              -p 3000:80 \
              ${{ secrets.DOCKER_USERNAME }}/catalog-client:previous || \
              sudo docker run -d \
                --name frontend \
                -p 3000:80 \
                ${{ secrets.DOCKER_USERNAME }}/catalog-client:latest
            
            echo "Rollback completed. Current containers:"
            sudo docker ps
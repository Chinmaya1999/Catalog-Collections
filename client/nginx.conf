# HTTP server - redirect to HTTPS (only if SSL certificates exist)
server {
    listen 80;
    server_name catalog.adihuman.com;

    # Check if SSL certificate exists, if not serve HTTP directly
    location / {
        if (-f /etc/letsencrypt/live/catalog.adihuman.com/fullchain.pem) {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend (HTTP version)
    location /api/ {
        set $backend_upstream http://server:5002;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS server (only enabled if SSL certificates exist)
server {
    listen 443 ssl http2;
    server_name catalog.adihuman.com;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/catalog.adihuman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalog.adihuman.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        set $backend_upstream http://server:5002;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

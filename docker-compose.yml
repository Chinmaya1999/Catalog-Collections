version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: catalog-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - catalog-network

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: catalog-server
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      MONGODB_URI: mongodb+srv://contact_db_user:VM7vPjtxhkZvOlnU@clusteradhiuman.znzeltu.mongodb.net/Adhiuman?appName=ClusterAdhiuman
      PORT: 5002
      JWT_SECRET: adihuman-secret-key-change-in-production
    depends_on:
      - mongodb
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - catalog-network

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: catalog-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - catalog-network

volumes:
  mongodb_data:

networks:
  catalog-network:
    driver: bridge

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: catalog-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - catalog-network

  # Backend Server
  server:
    image: awsmallick1999/catalog-server:latest
    container_name: catalog-server
    restart: unless-stopped
    ports:
      - "5002:5002"
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - catalog-network

  # Frontend Client
  client:
    image: awsmallick1999/catalog-client:latest
    container_name: catalog-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
    networks:
      - catalog-network

volumes:
  mongodb_data:

networks:
  catalog-network:
    driver: bridge
